[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nt-track-py"
version = "7.1.0"
description = "Python track generator + browser renderer for Nitro Type (hybrid port of teachingcom/nt-track)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "nt-track-py contributors" }]
keywords = ["nitrotype", "nt-track", "track", "generator", "userscript"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ntrack = "ntrack.cli:main"

[tool.setuptools]
packages = ["ntrack"]

[tool.setuptools.package-data]
ntrack = ["vendor/*.js", "vendor/*.json", "vendor/cars/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"